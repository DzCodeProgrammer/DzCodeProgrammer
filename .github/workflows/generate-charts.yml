name: Generate Profile Charts

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run chart generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          QT_API: 'https://quickchart.io/chart'
          GITHUB_USER: ${{ github.repository_owner }}
        run: node .github/profile-scripts/generate-charts.js

      - name: Commit and push charts
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/top-langs.png assets/commits-30days.png \
            assets/contribution-overview.svg assets/contribution-stats.json
          if git diff --cached --quiet; then
            echo "Profile charts are already current."
            exit 0
          fi
          git commit -m "chore: refresh profile charts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
