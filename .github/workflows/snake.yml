name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-contribution-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          # PROFILE_TOKEN lets the generator see the owner's private contribution
          # totals. Without it, the workflow safely falls back to public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify generated files
        shell: bash
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg

      - name: Publish to output branch
        shell: bash
        run: |
          git fetch origin output
          git worktree add --detach "$RUNNER_TEMP/profile-output" origin/output
          cp dist/snake.svg "$RUNNER_TEMP/profile-output/snake.svg"
          cp dist/snake-dark.svg "$RUNNER_TEMP/profile-output/snake-dark.svg"
          cd "$RUNNER_TEMP/profile-output"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake is already current."
            exit 0
          fi
          git commit -m "chore: refresh contribution snake"
          git push origin HEAD:output
